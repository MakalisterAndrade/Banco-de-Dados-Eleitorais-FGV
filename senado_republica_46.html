<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#1a3a5c;--azul2:#2b5f8e;--cinza:#f4f6f9;--borda:#d0d8e4;--texto:#1a1a2e;--ouro:#c8960c}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--cinza);color:var(--texto)}
header{background:var(--azul);color:white;padding:1.4rem 2rem}
header h1{font-size:1.28rem;font-weight:700;line-height:1.35}
header p{font-size:.81rem;opacity:.72;margin-top:.3rem}
.nav-link{font-size:.78rem;color:rgba(255,255,255,.65);text-decoration:none;margin-top:.5rem;display:inline-block}
.nav-link:hover{color:white}
.container{max-width:1100px;margin:0 auto;padding:1.3rem}
.controls{background:white;border:1px solid var(--borda);border-radius:8px;padding:1rem 1.4rem;margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end}
.ctrl label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;color:#666;letter-spacing:.04em;margin-bottom:.28rem}
select{padding:.42rem .72rem;border:1px solid var(--borda);border-radius:5px;font-size:.87rem;background:white;cursor:pointer;min-width:155px}
select:focus{outline:none;border-color:var(--azul2)}
.vbtns{display:flex;gap:.3rem}
.vbtns button{padding:.38rem .82rem;border:1px solid var(--borda);border-radius:5px;background:white;cursor:pointer;font-size:.81rem;color:#555}
.vbtns button.on{background:var(--azul);color:white;border-color:var(--azul)}
.aviso{background:#fff8e1;border-left:3px solid #f9a825;padding:.6rem .9rem;font-size:.8rem;color:#555;margin-bottom:.8rem;border-radius:3px;line-height:1.5}
.tbl-wrap{background:white;border:1px solid var(--borda);border-radius:8px;overflow:auto;margin-bottom:.7rem}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead tr{background:var(--azul);color:white}
th{padding:.55rem .8rem;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.02em;font-weight:600;white-space:nowrap}
th.r{text-align:right}
tbody tr{border-bottom:1px solid #eee}
tbody tr:hover td{background:#f5f8ff!important}
tbody tr.est-hdr td{background:#edf2fb;font-weight:700;color:var(--azul2);padding:.45rem .8rem;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase}
tbody tr.eleito td{background:#fffdf0}
tbody tr.eleito td.nome-td{border-left:3px solid var(--ouro)}
tbody tr.total-row td{font-weight:700;background:var(--azul)!important;color:white;font-size:.82rem}
td{padding:.4rem .8rem;vertical-align:middle}
td.r{text-align:right}
.badge-eleito{display:inline-block;background:#f0c040;color:#5a3d00;font-size:.63rem;font-weight:700;padding:.08rem .4rem;border-radius:3px;margin-left:.4rem;vertical-align:middle;white-space:nowrap}
.badge-cargo{display:inline-block;font-size:.68rem;color:#888;border:1px solid #ddd;border-radius:3px;padding:.05rem .3rem;margin-left:.3rem;white-space:nowrap}
.barra{display:inline-block;height:8px;border-radius:2px;margin-right:.35rem;vertical-align:middle;min-width:2px}
.nota{font-size:.76rem;color:#888;font-style:italic;margin-top:.45rem;line-height:1.5;padding:.5rem .7rem;background:white;border-left:3px solid var(--borda);border-radius:3px}
.hidden{display:none!important}
footer{text-align:center;padding:1.4rem;color:#bbb;font-size:.75rem;border-top:1px solid var(--borda);margin-top:1.4rem}
</style>
</head>

const AVISOS={
  "1945":"Em 1945 cada estado elegeu 2 ou 3 senadores (conforme vagas em aberto). A coluna de cargo não constava da fonte original; os candidatos eleitos estão marcados com ★.",
  "1962":"Os dados de 1962 incluem os novos estados (Acre, Amapá, Rondônia, Roraima) que passaram a eleger senadores nessa legislatura.",
  "1950":"Siglas de coligações: CDP – Coligação Democrática Paraense (Pará); OP-COL – Oposições Coligadas (Maranhão).",
  "1958":"Siglas de coligações: CDP – Coligação Democrática Paraense (Pará; PTB-CDP)."
};

const NOTAS={
  "1962":"Fonte: <i>Dados Estatísticos: Eleições Federais e Estaduais Realizadas no Brasil em 1962</i> (TSE, 6.º vol.). Rio Grande do Norte: para Walfredo Gurgel adota-se 108.301, valor do quadro de eleitos e do total apurado; o quadro sinóptico do estado imprime 108.103. Em Goiás e no Maranhão a soma dos votos dos candidatos (520.151 e 557.531) difere do total de votos nominais publicado pelo TSE (520.781 e 557.541). No Ceará, os votos seguem o quadro sinóptico (Wilson Gonçalves 303.955; Carlos Jereissati 230.333), que difere do quadro de candidatos eleitos (300.683 e 229.021)."
};

const fmt=n=>n==null?'–':Number(n).toLocaleString('pt-BR');

// Party color map (consistent)
const PCOLORS={PSD:'#1a3a5c',UDN:'#c0392b',PTB:'#27ae60',PCB:'#7f0000',
  PSP:'#8e44ad',PR:'#e67e22',PDC:'#16a085',PSB:'#2980b9',PL:'#795548',
  PRP:'#607d8b',PTN:'#f39c12',PST:'#95a5a6',PRT:'#d35400',PPS:'#1abc9c',
  ED:'#ff5722',MTR:'#cddc39',PPB:'#3498db',CDP:'#27ae60',PDS:'#1a3a5c'};
function pcolor(p){
  if(!p||p==='–') return '#ccc';
  const base=p.split('-')[0].split('/')[0].trim();
  return PCOLORS[base]||(PCOLORS[p])||('#'+Math.abs(p.split('').reduce((a,c)=>a*31+c.charCodeAt(0),0)).toString(16).slice(-6));
}

function normCargo(c,y){
  if(!c) return y===1945?'':c;
  const u=c.toUpperCase();
  if(u.includes('SENADOR')||u.includes('SENADO')) return 'Senador';
  if(u.includes('SUPLENTE')||u.includes('SUPELNTE')) return 'Suplente';
  if(u.includes('SUP.')) return c.replace('Sup.','Sup.').trim();
  return c;
}

function isSenador(c,y){
  const nc=normCargo(c.cargo,y);
  return c.eleito && (nc===''||nc==='Senador'||nc==='Senado');
}

function render(){
  const ano=document.getElementById('ano').value;
  const filtro=document.getElementById('filtro').value;
  const d=D[ano];
  
  // Aviso
  const av=document.getElementById('aviso');
  if(AVISOS[ano]){av.textContent=AVISOS[ano];av.classList.remove('hidden');}
  else{av.classList.add('hidden');}
  
  // Header
  const hasCargo = d.estados.some(e=>e.candidatos.some(c=>c.cargo&&c.cargo.trim()));
  document.getElementById('th').innerHTML=`<tr>
    <th style="min-width:155px">Estado</th>
    <th style="min-width:220px">Candidato</th>
    ${hasCargo?'<th style="min-width:90px">Cargo</th>':''}
    <th style="min-width:100px">Partido</th>
    <th class="r" style="min-width:85px">Votos</th>
    <th class="r" style="min-width:55px">%</th>
  </tr>`;
  
  // Rows
  let html='';
  let grandTotal=0;
  
  for(const est of d.estados){
    const cands = filtro==='senadores'
      ? est.candidatos.filter(c=>isSenador(c,ano))
      : est.candidatos;
    if(!cands.length) continue;
    
    const tot=est.total || cands.reduce((a,c)=>a+(c.votos||0),0);
    grandTotal+=tot;
    
    // State header row
    html+=`<tr class="est-hdr"><td colspan="${hasCargo?6:5}">${est.estado}</td></tr>`;
    
    for(const c of cands){
      const eleito=c.eleito;
      const pct=tot>0&&c.votos!=null?(c.votos/tot*100).toFixed(1):'–';
      const cargo=normCargo(c.cargo,parseInt(ano));
      const cor=pcolor(c.partido.split('-')[0].split('/')[0].trim());
      const barra=c.votos&&tot>0?`<span class="barra" style="width:${Math.round(c.votos/tot*50)}px;background:${cor}"></span>`:'';
      const badgeEleito=eleito?'<span class="badge-eleito">★ Eleito</span>':'';
      const badgeCargo=hasCargo&&cargo?`<span class="badge-cargo">${cargo}</span>`:'';
      html+=`<tr class="${eleito?'eleito':''}">
        <td></td>
        <td class="nome-td">${c.nome}${badgeEleito}</td>
        ${hasCargo?`<td><span style="font-size:.77rem;color:#666">${eleito?cargo:''}</span></td>`:''}
        <td><span style="font-size:.8rem">${c.partido}</span></td>
        <td class="r">${barra}${fmt(c.votos)}</td>
        <td class="r" style="color:#888;font-size:.78rem">${pct}%</td>
      </tr>`;
    }
    
    // State total
    if(filtro!=='senadores'){
      html+=`<tr class="total-row"><td></td><td>Total — ${est.estado}</td>${hasCargo?'<td></td>':''}<td></td><td class="r">${fmt(tot)}</td><td class="r"></td></tr>`;
    }
  }
  
  document.getElementById('tb').innerHTML=html;
  
  // Nota
  const nota=document.getElementById('nota');
  const ntxt=NOTAS[ano]||'Fonte: TSE — Dados Estatísticos: Eleições Federais e Estaduais realizadas no Brasil.';
  nota.textContent=ntxt;
  nota.classList.remove('hidden');
}

render();
</script>
