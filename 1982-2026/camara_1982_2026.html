const CL=['Eleitorado','Comparecimento','Abstenção','Brancos','Nulos','Votos nos partidos e candidatos'];
const OUT='#c8cfd8';
let ch=null,vw='t';
const fmt=n=>n==null?'–':Number(n).toLocaleString('pt-BR');
const pc=(v,t)=>t?(v/t*100).toFixed(1).replace('.',','):'';
const p1=(v,t)=>t?pc(v,t)+'%':'';
const sum=a=>a.reduce((x,y)=>x+y,0);
function sv(v){vw=v;bt.className=v==='t'?'on':'';bg.className=v==='g'?'on':'';render();}
// devolve partidos, cores e linhas já agregadas ("Outros") conforme a escolha do usuário
function prep(d,tipo){
  const P=tipo==='v'?d.partidos_v:d.partidos_c,key=tipo==='v'?'votos':'cad';
  const n=np.value==='todos'?P.length:Math.min(+np.value,P.length);
  const nomes=P.slice(0,n),cores=nomes.map(p=>d.cores[p]||'#9aa5b1');
  const linhas=d.dados.map(r=>{const x=r[key];const v=x.slice(0,n);if(P.length>n)v.push(sum(x.slice(n)));return{estado:r.estado,tipo:r.tipo,v};});
  if(P.length>n){nomes.push('Outros');cores.push(OUT);}
  return{nomes,cores,linhas};
}
function render(){
  const d=D[ano.value],tipo=document.getElementById('tipo').value,com=sub.value==='com';
  np.disabled=tipo==='c';
  const T=d.dados.find(r=>r.tipo==='total');let cards='';
  if(tipo==='c'){
    const c=T.comp;
    cards=[[1,0],[2,0],[3,1],[4,1],[5,1]].map(([i,b])=>`<div class="card"><div class="nm">${CL[i]}</div><div class="pt">${b===0?'sobre o eleitorado':'sobre o comparecimento'}</div><div class="vl">${fmt(c[i])}</div><div class="pc">${p1(c[i],c[b])}</div></div>`).join('')+`<div class="card"><div class="nm">Eleitorado</div><div class="pt">${d.ano}</div><div class="vl">${fmt(c[0])}</div></div>`;
  }else{
    const P=tipo==='v'?d.partidos_v:d.partidos_c,x=tipo==='v'?T.votos:T.cad,t=sum(x);
    cards=P.slice(0,6).map((p,i)=>`<div class="card"><div class="nm"><span class="b" style="display:inline-block;width:9px;height:9px;margin-right:5px;background:${d.cores[p]}"></span>${p}</div><div class="pt">${tipo==='v'?'votos':'cadeiras'}</div><div class="vl">${fmt(x[i])}</div><div class="pc">${p1(x[i],t)}</div></div>`).join('');
    cards+=`<div class="card"><div class="nm">${tipo==='v'?'Votos nos partidos e candidatos':'Total de cadeiras'}</div><div class="pt">${d.ano} &middot; ${P.length} partidos</div><div class="vl">${fmt(t)}</div></div>`;
  }
  document.getElementById('cards').innerHTML=cards;
  cbox.classList.toggle('hidden',vw!=='g');tbox.classList.toggle('hidden',vw!=='t');
  vw==='g'?renderG(d,tipo):renderT(d,tipo,com);
  nota.textContent=d.nota||'';nota.classList.toggle('hidden',!d.nota);
}
function renderG(d,tipo){
  if(ch){ch.destroy();ch=null;}
  const est=d.dados.filter(r=>r.tipo==='estado');let ds,labels=est.map(r=>r.estado);
  if(tipo==='c'){
    ctit.textContent='Abstenção, brancos e nulos por estado (%) — '+d.ano;
    ds=[{label:'Abstenção (% eleitorado)',data:est.map(r=>r.comp[2]/r.comp[0]*100),backgroundColor:'#1a3a5c'},{label:'Brancos (% comparecimento)',data:est.map(r=>r.comp[3]/r.comp[1]*100),backgroundColor:'#e67e22'},{label:'Nulos (% comparecimento)',data:est.map(r=>r.comp[4]/r.comp[1]*100),backgroundColor:'#c0392b'}];
  }else{
    const P=tipo==='v'?d.partidos_v:d.partidos_c,key=tipo==='v'?'votos':'cad',n=Math.min(P.length,8);
    ctit.textContent=(tipo==='v'?'Votos':'Cadeiras')+' por estado (%) — '+d.ano;
    ds=P.slice(0,n).map((p,i)=>({label:p,data:est.map(r=>r[key][i]/sum(r[key])*100),backgroundColor:d.cores[p]}));
    if(P.length>n)ds.push({label:'Outros',data:est.map(r=>sum(r[key].slice(n))/sum(r[key])*100),backgroundColor:OUT});
  }
  ch=new Chart(cv,{type:'bar',data:{labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toFixed(1).replace('.',',')+'%'}}},
    scales:{x:{stacked:tipo!=='c',ticks:{font:{size:9},maxRotation:60}},y:{stacked:tipo!=='c',max:tipo!=='c'?100:undefined,ticks:{callback:v=>v+'%'}}}}});
}
function renderT(d,tipo,com){
  const cls=r=>r.tipo==='subtotal'?'sub':r.tipo==='total'?'tot':'';
  if(tipo==='c'){
    const rows=com?d.dados:d.dados.filter(r=>r.tipo!=='subtotal');
    th.innerHTML=`<tr><th>Estado</th>${CL.map(c=>`<th>${c}</th>`).join('')}<th>% Abstenção</th><th>% Brancos</th><th>% Nulos</th></tr>`;
    tb.innerHTML=rows.map(r=>{const c=r.comp;return`<tr class="${cls(r)}"><td>${r.estado}</td>${c.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${p1(c[2],c[0])}</td><td>${p1(c[3],c[1])}</td><td>${p1(c[4],c[1])}</td></tr>`}).join('');
    return;
  }
  const {nomes,cores,linhas}=prep(d,tipo),rows=com?linhas:linhas.filter(r=>r.tipo!=='subtotal');
  th.innerHTML=`<tr><th>Estado</th>${nomes.map(p=>`<th>${p}</th>`).join('')}<th>Total</th></tr>`;
  tb.innerHTML=rows.map(r=>{const rt=sum(r.v);
    return`<tr class="${cls(r)}"><td>${r.estado}</td>${r.v.map((v,i)=>{const p=rt?v/rt:0;return v===0?`<td><span class="pp">–</span></td>`:`<td><div class="bw"><span class="b" style="width:${Math.round(p*55)}px;background:${cores[i]}"></span><span>${fmt(v)}</span><span class="pp">${(p*100).toFixed(1).replace('.',',')}%</span></div></td>`}).join('')}<td><b>${fmt(rt)}</b></td></tr>`}).join('');
}
function csv(){
  const d=D[ano.value],tipo=document.getElementById('tipo').value;let h,L;
  if(tipo==='c'){h=['estado','tipo',...CL];L=d.dados.map(r=>[r.estado,r.tipo,...r.comp]);}
  else{const P=tipo==='v'?d.partidos_v:d.partidos_c,key=tipo==='v'?'votos':'cad';h=['estado','tipo',...P,'total'];L=d.dados.map(r=>[r.estado,r.tipo,...r[key],sum(r[key])]);}
  const s=[h,...L].map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='camara_'+d.ano+({v:'_votos',s:'_cadeiras',c:'_comparecimento'})[tipo]+'.csv';a.click();
}
const hm={'#votos':'v','#cadeiras':'s','#comparecimento':'c'};
if(hm[location.hash])document.getElementById('tipo').value=hm[location.hash];
ano.value=Object.keys(D).slice(-1)[0];
render();
</script>
