  const k=ano.value,d=D[k],tipo=document.getElementById('tipo').value,com=sub.value==='com';CUR=tipo==='v'?d.cores:null;
  const T=d.dados.find(r=>r.tipo==='total');
  const tv=T.votos.reduce((a,b)=>a+b,0);
  let cards;
  if(tipo==='v'){
    const idx=d.candidatos.map((c,i)=>i).slice(0,6);
    cards=idx.map(i=>{const c=d.candidatos[i],w=c===d.eleito;return`<div class="card ${w?'win':''}"><div class="nm">${c}</div><div class="pt">${d.partidos[i]}</div><div class="vl">${fmt(T.votos[i])}</div><div class="pc">${p1(T.votos[i],tv)}${w?' &middot; <b>Eleito</b>':''}</div></div>`}).join('');
    cards+=`<div class="card"><div class="nm">Votos nos candidatos</div><div class="pt">${d.ano} &middot; ${d.turno}º turno</div><div class="vl">${fmt(tv)}</div></div>`;
  }else{
    const c=T.comp;
    cards=[[1,0],[2,0],[3,1],[4,1],[5,1]].map(([i,b])=>`<div class="card"><div class="nm">${CL[i]}</div><div class="pt">${b===0?'sobre o eleitorado':'sobre o comparecimento'}</div><div class="vl">${fmt(c[i])}</div><div class="pc">${p1(c[i],c[b])}</div></div>`).join('')+`<div class="card"><div class="nm">Eleitorado</div><div class="pt">${d.ano} &middot; ${d.turno}º turno</div><div class="vl">${fmt(c[0])}</div></div>`;
  }
  cardsEl().innerHTML=cards;
  cbox.classList.toggle('hidden',vw!=='g');tbox.classList.toggle('hidden',vw!=='t');
  vw==='g'?renderG(d,tipo):renderT(d,tipo,com);
  nota.textContent=d.nota||'';
}
function cardsEl(){return document.getElementById('cards');}
function renderG(d,tipo){
  if(ch){ch.destroy();ch=null;}
  const rows=d.dados.filter(r=>r.tipo==='estado');
  let ds;
  if(tipo==='v'){
    ctit.textContent='Votos por estado (%) — '+d.ano+', '+d.turno+'º turno';
    const n=Math.min(d.candidatos.length,5);
    ds=d.candidatos.slice(0,n).map((c,i)=>({label:c,data:rows.map(r=>r.votos[i]/r.votos.reduce((a,b)=>a+b,0)*100),backgroundColor:col(i)}));
    if(d.candidatos.length>n) ds.push({label:'Outros',data:rows.map(r=>r.votos.slice(n).reduce((a,b)=>a+b,0)/r.votos.reduce((a,b)=>a+b,0)*100),backgroundColor:'#c8cfd8'});
  }else{
    ctit.textContent='Abstenção, brancos e nulos por estado (%) — '+d.ano+', '+d.turno+'º turno';
    ds=[{label:'Abstenção (% eleitorado)',data:rows.map(r=>r.comp[2]/r.comp[0]*100),backgroundColor:col(0)},{label:'Brancos (% comparecimento)',data:rows.map(r=>r.comp[3]/r.comp[1]*100),backgroundColor:col(3)},{label:'Nulos (% comparecimento)',data:rows.map(r=>r.comp[4]/r.comp[1]*100),backgroundColor:col(1)}];
  }
  ch=new Chart(cv,{type:'bar',data:{labels:rows.map(r=>r.estado),datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toFixed(1).replace('.',',')+'%'}}},
    scales:{x:{stacked:tipo==='v',ticks:{font:{size:9},maxRotation:60}},y:{stacked:tipo==='v',max:tipo==='v'?100:undefined,ticks:{callback:v=>v+'%'}}}}});
}
function renderT(d,tipo,com){
  const rows=com?d.dados:d.dados.filter(r=>r.tipo!=='subtotal');
  if(tipo==='v'){
    th.innerHTML=`<tr><th>Estado</th>${d.candidatos.map((c,i)=>`<th>${c}<br><span style="font-weight:400;opacity:.7;font-size:.68rem">${d.partidos[i]}</span></th>`).join('')}<th>Total</th></tr>`;
    tb.innerHTML=rows.map(r=>{const rt=r.votos.reduce((a,b)=>a+b,0);
      return`<tr class="${r.tipo==='subtotal'?'sub':r.tipo==='total'?'tot':''}"><td>${r.estado}</td>${r.votos.map((v,i)=>{const p=rt?v/rt:0;return`<td><div class="bw"><span class="b" style="width:${Math.round(p*65)}px;background:${col(i)}"></span><span>${fmt(v)}</span><span class="pp">${(p*100).toFixed(1).replace('.',',')}%</span></div></td>`}).join('')}<td><b>${fmt(rt)}</b></td></tr>`}).join('');
  }else{
    th.innerHTML=`<tr><th>Estado</th>${CL.map(c=>`<th>${c}</th>`).join('')}<th>% Abstenção</th><th>% Brancos</th><th>% Nulos</th></tr>`;
    tb.innerHTML=rows.map(r=>{const c=r.comp;return`<tr class="${r.tipo==='subtotal'?'sub':r.tipo==='total'?'tot':''}"><td>${r.estado}</td>${c.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${p1(c[2],c[0])}</td><td>${p1(c[3],c[1])}</td><td>${p1(c[4],c[1])}</td></tr>`}).join('');
  }
}
function csv(){
  const k=ano.value,d=D[k],tipo=document.getElementById('tipo').value;
  let h,L;
  if(tipo==='v'){h=['estado','tipo',...d.candidatos.map((c,i)=>c+' ('+d.partidos[i]+')'),'total'];L=d.dados.map(r=>[r.estado,r.tipo,...r.votos,r.votos.reduce((a,b)=>a+b,0)]);}
  else{h=['estado','tipo',...CL];L=d.dados.map(r=>[r.estado,r.tipo,...r.comp]);}
  const s=[h,...L].map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='presidente_'+k+(tipo==='v'?'_votos':'_comparecimento')+'.csv';a.click();
}
render();
</script>
</body>
</html>
