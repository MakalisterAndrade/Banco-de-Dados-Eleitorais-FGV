<title>Governadores – República de 1946</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#1a3a5c;--azul2:#2b5f8e;--cinza:#f4f6f9;--borda:#d0d8e4;--texto:#1a1a2e;--ouro:#c8960c}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--cinza);color:var(--texto)}
header{background:var(--azul);color:white;padding:1.4rem 2rem}
header h1{font-size:1.28rem;font-weight:700;line-height:1.35}
header p{font-size:.81rem;opacity:.72;margin-top:.3rem}
.nav-link{font-size:.78rem;color:rgba(255,255,255,.65);text-decoration:none;margin-top:.5rem;display:inline-block}
.nav-link:hover{color:white}
.container{max-width:1100px;margin:0 auto;padding:1.3rem}
.controls{background:white;border:1px solid var(--borda);border-radius:8px;padding:1rem 1.4rem;margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end}
.ctrl label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;color:#666;letter-spacing:.04em;margin-bottom:.28rem}
select{padding:.42rem .72rem;border:1px solid var(--borda);border-radius:5px;font-size:.87rem;background:white;cursor:pointer;min-width:155px}
select:focus{outline:none;border-color:var(--azul2)}
.aviso{background:#fff8e1;border-left:3px solid #f9a825;padding:.6rem .9rem;font-size:.8rem;color:#555;margin-bottom:.8rem;border-radius:3px;line-height:1.5}
.aviso.hidden{display:none}
.tbl-wrap{background:white;border:1px solid var(--borda);border-radius:8px;overflow:auto;margin-bottom:.7rem}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead tr{background:var(--azul);color:white}
th{padding:.55rem .8rem;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.02em;font-weight:600;white-space:nowrap}
th.r{text-align:right}
tbody tr{border-bottom:1px solid #eee}
tbody tr:hover td{background:#f5f8ff!important}
tbody tr.est-hdr td{background:#edf2fb;font-weight:700;color:var(--azul2);padding:.45rem .8rem;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase}
tbody tr.eleito td{background:#fffdf0}
tbody tr.eleito td.nome-td{border-left:3px solid var(--ouro)}
td{padding:.4rem .8rem;vertical-align:middle}
td.r{text-align:right}
.badge-eleito{display:inline-block;background:#f0c040;color:#5a3d00;font-size:.63rem;font-weight:700;padding:.08rem .4rem;border-radius:3px;margin-left:.4rem;vertical-align:middle;white-space:nowrap}
.barra{display:inline-block;height:8px;border-radius:2px;margin-right:.35rem;vertical-align:middle;min-width:2px}
.nota{font-size:.76rem;color:#888;font-style:italic;margin-top:.45rem;line-height:1.5;padding:.5rem .7rem;background:white;border-left:3px solid var(--borda);border-radius:3px}
footer{text-align:center;padding:1.4rem;color:#bbb;font-size:.75rem;border-top:1px solid var(--borda);margin-top:1.4rem}
</style>
</head>

  <a class="nav-link" href="index.html">← Página inicial</a>
</header>

        <option value="1958">1958</option>

        <option value="1962">1962</option>

    </div>
    <div class="ctrl">

      </select>
    </div>
  </div>
  <div class="tbl-wrap">
    <table><thead id="th"></thead><tbody id="tb"></tbody></table>
  </div>
  <p id="nota" class="nota"></p>
</div>

const AVISOS={"1947": "Eleições para governador realizadas em 19 de janeiro de 1947. <b>Atenção:</b> no Piauí, a fonte marca como eleito o candidato com menos votos (José da Rocha Furtado, UDN, 48,1%); o dado foi mantido como consta na fonte. Em Minas Gerais, nenhum candidato está marcado como eleito na fonte (possível erro de digitação).", "1950": "Eleições para governador realizadas em 3 de outubro de 1950.", "1954-55": "Eleições realizadas em 3 de outubro de 1954 (maioria dos estados) e em 1955 (Acre).", "1958": "Eleições para governador realizadas em 3 de outubro de 1958. Apenas 10 estados realizaram eleições nesse ano.", "1960": "Eleições realizadas em 3 de outubro de 1960. Apenas 11 estados realizaram eleições nesse ano.", "1962": "Eleições para governador realizadas em 7 de outubro de 1962."};
const NOTAS={"1947": "Fonte: banco de dados eleitoral da República de 1946 (FGV). Piauí: eleito marcado na fonte com 48,1% dos votos (candidato do PSD obteve 51,9%). Minas Gerais: nenhum candidato marcado como eleito na fonte.", "1950": "Fonte: <i>Dados Estatísticos: Eleições Federais e Estaduais Realizadas no Brasil em 1950</i> (TSE, vol. 2).", "1954-55": "Fonte: banco de dados eleitoral da República de 1946 (FGV).", "1958": "Fonte: banco de dados eleitoral da República de 1946 (FGV).", "1960": "Fonte: <i>Dados Estatísticos: Eleições Federais e Estaduais Realizadas no Brasil em 1960</i> (TSE).", "1962": "Fonte: <i>Dados Estatísticos: Eleições Federais e Estaduais Realizadas no Brasil em 1962</i> (TSE, 6.º vol.). No Ceará, os votos seguem o quadro sinóptico do estado (Virgílio Távora 371.466), que difere do quadro de candidatos eleitos (367.424)."};
function fmt(n){if(n==null)return'–';return Math.round(n).toLocaleString('pt-BR');}
function fmtPct(p){if(p==null)return'–';return p.toFixed(1).replace('.',',')+'%';}
function render(){
  const ano=document.getElementById('ano').value;
  const filtro=document.getElementById('filtro').value;
  const estados=D[ano]||[];
  const avDiv=document.getElementById('aviso');
  if(AVISOS[ano]){avDiv.innerHTML=AVISOS[ano];avDiv.classList.remove('hidden');}
  else avDiv.classList.add('hidden');
  document.getElementById('th').innerHTML=
    '<tr><th>Estado</th><th>Candidato</th><th>Partido / Coligação</th>'+
    '<th class="r">Votos</th><th class="r">%</th></tr>';
  const tb=document.getElementById('tb');
  tb.innerHTML='';
  for(const est of estados){
    let cands=est.candidatos;
    if(filtro==='eleitos') cands=cands.filter(c=>c.eleito);
    if(cands.length===0) continue;
    const hr=document.createElement('tr');
    hr.className='est-hdr';
    hr.innerHTML=`<td colspan="5">${est.estado}</td>`;
    tb.appendChild(hr);
    const maxV=Math.max(...cands.map(c=>c.votos||0));
    for(const c of cands){
      const tr=document.createElement('tr');
      if(c.eleito) tr.className='eleito';
      const barW=maxV>0&&c.votos?Math.round(c.votos/maxV*60):0;
      const barColor=c.eleito?'#c8960c':'#a0b8d8';
      tr.innerHTML=
        `<td></td>`+
        `<td class="nome-td">${c.nome}${c.eleito?'<span class="badge-eleito">★ eleito</span>':''}</td>`+
        `<td>${c.partido||'–'}</td>`+
        `<td class="r"><span class="barra" style="width:${barW}px;background:${barColor}"></span>${fmt(c.votos)}</td>`+
        `<td class="r">${fmtPct(c.pct)}</td>`;
      tb.appendChild(tr);
    }
  }
  document.getElementById('nota').innerHTML=NOTAS[ano]||'';
}
render();
</script>
