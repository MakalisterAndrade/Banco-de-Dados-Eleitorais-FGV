<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#1a3a5c;--azul2:#2b5f8e;--cinza:#f4f6f9;--borda:#d0d8e4;--texto:#1a1a2e}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--cinza);color:var(--texto)}
header{background:var(--azul);color:white;padding:1.4rem 2rem}
header h1{font-size:1.28rem;font-weight:700;line-height:1.35}
header p{font-size:.81rem;opacity:.72;margin-top:.3rem}
.container{max-width:1400px;margin:0 auto;padding:1.3rem}
.controls{background:white;border:1px solid var(--borda);border-radius:8px;padding:1rem 1.4rem;margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end}
.ctrl label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;color:#666;letter-spacing:.04em;margin-bottom:.28rem}
select{padding:.42rem .72rem;border:1px solid var(--borda);border-radius:5px;font-size:.87rem;background:white;cursor:pointer;min-width:155px}
select:focus{outline:none;border-color:var(--azul2)}
.vbtns{display:flex;gap:.3rem}
.vbtns button{padding:.38rem .82rem;border:1px solid var(--borda);border-radius:5px;background:white;cursor:pointer;font-size:.81rem;color:#555}
.vbtns button.on{background:var(--azul);color:white;border-color:var(--azul)}
.sumario{display:flex;flex-wrap:wrap;gap:.65rem;margin-bottom:1rem}
.scard{background:white;border:1px solid var(--borda);border-radius:8px;padding:.7rem 1rem;display:flex;align-items:center;gap:.6rem;flex:0 0 auto}
.scard .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.scard .snm{font-size:.75rem;font-weight:700;color:var(--azul)}
.scard .svl{font-size:1.05rem;font-weight:700;color:var(--azul)}
.scard .spc{font-size:.72rem;color:#888}
.tbl-wrap{background:white;border:1px solid var(--borda);border-radius:8px;overflow:auto;margin-bottom:.7rem}
table{width:100%;border-collapse:collapse;font-size:.81rem}
thead tr{background:var(--azul);color:white}
th{padding:.55rem .6rem;text-align:right;font-size:.7rem;text-transform:uppercase;letter-spacing:.02em;font-weight:600;white-space:nowrap}
th:first-child{text-align:left;min-width:145px;position:sticky;left:0;background:var(--azul);z-index:2}
tbody tr{border-bottom:1px solid #eee}
tbody tr:hover td{background:#f5f8ff}
tbody tr.sub td{font-weight:700;color:var(--azul2);background:#edf2fb}
tbody tr.sub td:first-child{background:#edf2fb}
tbody tr.tot td{font-weight:700;color:white;background:var(--azul)}
tbody tr.tot td:first-child{background:var(--azul)}
td{padding:.38rem .6rem;text-align:right;vertical-align:middle}
td:first-child{text-align:left;position:sticky;left:0;background:white;z-index:1;border-right:1px solid var(--borda)}
.cv{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.cv .abs{font-size:.81rem}
.cv .pct{font-size:.67rem;color:#aaa}
.aviso{background:#fff8e1;border-left:3px solid #f9a825;padding:.6rem .9rem;font-size:.8rem;color:#555;margin-bottom:.8rem;border-radius:3px;line-height:1.5}
.nota{font-size:.76rem;color:#888;font-style:italic;margin-top:.45rem;line-height:1.5;padding:.5rem .7rem;background:white;border-left:3px solid var(--borda);border-radius:3px}
.hidden{display:none!important}
footer{text-align:center;padding:1.4rem;color:#bbb;font-size:.75rem;border-top:1px solid var(--borda);margin-top:1.4rem}
.nav-link{font-size:.78rem;color:rgba(255,255,255,.65);text-decoration:none;margin-top:.5rem;display:inline-block}
.nav-link:hover{color:white}
</style>

// Party color map (consistent across years)
const PCOLORS={
  PSD:'#1a3a5c',UDN:'#c0392b',PTB:'#27ae60',PCB:'#7f0000',
  PSP:'#8e44ad',PR:'#e67e22',PDC:'#16a085',PSB:'#2980b9',
  PL:'#795548',PRP:'#607d8b',PTN:'#f39c12',PST:'#95a5a6',
  PRT:'#d35400',PPS:'#1abc9c','PRProg.':'#9b59b6',PRD:'#bdc3c7',
  PAN:'#7f8c8d',POT:'#e91e63',PRB:'#00bcd4',ED:'#ff5722',
  MTR:'#cddc39',Outros:'#aaa'
};
function pcolor(p){return PCOLORS[p]||('#'+Math.abs(p.split('').reduce((a,c)=>a*31+c.charCodeAt(0),0)).toString(16).slice(-6));}

const fmt=n=>n==null?'–':Number(n).toLocaleString('pt-BR');

function render(){
  const ano=document.getElementById('ano').value;
  const com=document.getElementById('sub').value==='com';
  const d=D[ano];
  const ps=d.partidos;

  // Aviso para 1947
  const av=document.getElementById('aviso');
  if(d.nota){av.textContent=d.nota;av.classList.remove('hidden');}
  else{av.classList.add('hidden');}

  // Total nacional
  const tot=d.dados.find(r=>r.tipo==='total');
  const tv=tot?tot.votos.reduce((a,b)=>a+(b||0),0):0;

  // Sumário
  const nacional=[];
  if(tot){
    ps.forEach((p,i)=>{
      const v=tot.votos[i]||0;
      if(v>0) nacional.push({p,v,pct:tv>0?v/tv*100:0});
    });
    nacional.sort((a,b)=>b.v-a.v);
  }
  document.getElementById('sumario').innerHTML=nacional.slice(0,8).map(x=>
    `<div class="scard">
      <div class="dot" style="background:${pcolor(x.p)}"></div>
      <div>
        <div class="snm">${x.p}</div>
        <div class="svl">${fmt(x.v)}</div>
        <div class="spc">${x.pct.toFixed(1)}%</div>
      </div>
    </div>`
  ).join('')+(tv>0?`<div class="scard"><div><div class="snm">Total apurado</div><div class="svl">${fmt(tv)}</div></div></div>`:'');

  // Tabela header
  document.getElementById('th').innerHTML=
    `<tr><th>Estado</th>${ps.map(p=>`<th style="border-bottom:2px solid ${pcolor(p)}">${p}</th>`).join('')}<th>Total</th></tr>`;

  // Rows
  const rows=com?d.dados:d.dados.filter(r=>r.tipo!=='subtotal'&&r.tipo!=='subtotal');
  // Actually apply filter properly:
  const rowsF=com?d.dados:d.dados.filter(r=>!r.tipo.includes('subtotal'));

  document.getElementById('tb').innerHTML=rowsF.map(r=>{
    const cls=r.tipo==='subtotal'?'sub':r.tipo==='total'?'tot':'';
    const rt=r.votos.reduce((a,b)=>a+(b||0),0);
    const cells=ps.map((p,i)=>{
      const v=r.votos[i];
      const pct=rt>0&&v!=null?v/rt*100:null;
      return`<td><div class="cv"><span class="abs">${fmt(v)}</span>${pct!=null?`<span class="pct">${pct.toFixed(1)}%</span>`:'<span class="pct">–</span>'}</div></td>`;
    }).join('');
    return`<tr class="${cls}"><td>${r.estado}</td>${cells}<td><div class="cv"><span class="abs"><b>${fmt(rt)}</b></span></div></td></tr>`;
  }).join('');

  // Nota de fonte
  const nota=document.getElementById('nota');
  nota.textContent='Fonte: TSE — Dados Estatísticos: Eleições Federais e Estaduais realizadas no Brasil. Metodologia detalhada em: Nicolau, J. "Partidos na República de 1946: Velhas Teses, Novos Dados", Revista Dados, 47(1), 2004.';
  nota.classList.remove('hidden');
}

render();
</script>
