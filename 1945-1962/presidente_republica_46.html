.vbtns{display:flex;gap:.3rem}

.vbtns button.on{background:var(--azul);color:white;border-color:var(--azul)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:.65rem;margin-bottom:1rem}
.card{background:white;border:1px solid var(--borda);border-radius:8px;padding:.85rem 1rem}

.chart-wrap{position:relative;height:290px}
.tbl-wrap{background:white;border:1px solid var(--borda);border-radius:8px;overflow:auto;margin-bottom:.7rem}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead tr{background:var(--azul);color:white}

th:first-child{text-align:left;min-width:160px}
tbody tr{border-bottom:1px solid #eee}
tbody tr:hover{background:#f0f4ff}
tbody tr.sub td{font-weight:700;color:var(--azul2);background:#edf2fb}
tbody tr.tot td{font-weight:700;color:white;background:var(--azul)}
tbody tr.brasilia td{background:#fff8e1;font-style:italic}
td{padding:.48rem .82rem;text-align:right}
td:first-child{text-align:left}
.bw{display:inline-flex;align-items:center;gap:.38rem;justify-content:flex-end}
.b{height:11px;border-radius:2px;min-width:2px}
.pp{font-size:.7rem;color:#aaa;white-space:nowrap}
.nota{font-size:.76rem;color:#888;font-style:italic;margin-top:.45rem;line-height:1.5;padding:.5rem .7rem;background:white;border-left:3px solid var(--borda);border-radius:3px}
.fonte{font-size:.73rem;color:#bbb;margin-top:.25rem}
.hidden{display:none!important}
footer{text-align:center;padding:1.4rem;color:#bbb;font-size:.75rem;border-top:1px solid var(--borda);margin-top:1.4rem}

let ch=null,vw='t';

const fmt=n=>n==null?'–':Number(n).toLocaleString('pt-BR');
const pct=(v,t)=>v&&t?(v/t*100).toFixed(1)+'%':'';

function sv(v){vw=v;document.getElementById('bt').className=v==='t'?'on':'';document.getElementById('bg').className=v==='g'?'on':'';render();}

function render(){
  const ano=document.getElementById('ano').value;
  const com=document.getElementById('sub').value==='com';
  const d=D[ano];
  const cs=d.candidatos, ps=d.partidos, el=d.eleito;

  // Total nacional
  const tot_row=d.dados.find(r=>r.tipo==='total');
  const tv=tot_row?tot_row.votos.reduce((a,b)=>a+(b||0),0):0;

  // Cards
  document.getElementById('cards').innerHTML=cs.map((c,i)=>{
    const v=tot_row?tot_row.votos[i]||0:0;
    return`<div class="card ${c===el?'win':''}"><div class="nm">${c}</div><div class="pt">${ps[i]||''}</div><div class="vl">${fmt(v)}</div><div class="pc">${pct(v,tv)}${c===el?' &middot; <b>Eleito</b>':''}</div></div>`;
  }).join('')+`<div class="card"><div class="nm">Total apurado</div><div class="pt">Eleição de ${ano}</div><div class="vl">${fmt(tv)}</div></div>`;

  document.getElementById('cbox').classList.toggle('hidden',vw!=='g');
  document.getElementById('tbox').classList.toggle('hidden',vw!=='t');

  vw==='g'?renderG(d,ano):renderT(d,cs,ps,tv,com);

  document.getElementById('nota').textContent=d.nota||'';
  document.getElementById('fonte').innerHTML='Fonte: '+(d.fonte||'');
}

function renderG(d,ano){
  document.getElementById('ctit').textContent='Distribuição de votos por estado — '+ano;
  if(ch){ch.destroy();ch=null;}
  const rows=d.dados.filter(r=>r.tipo==='estado');
  ch=new Chart(document.getElementById('cv'),{
    type:'bar',
    data:{labels:rows.map(r=>r.estado),
          datasets:d.candidatos.map((c,i)=>({label:c,data:rows.map(r=>r.votos[i]||0),backgroundColor:CRS[i]}))},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10}}}},
      scales:{x:{ticks:{font:{size:9},maxRotation:50}},
              y:{ticks:{callback:v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'k':v}}}}
  });
}

function renderT(d,cs,ps,tv,com){
  document.getElementById('th').innerHTML=`<tr><th>Estado</th>${cs.map((c,i)=>`<th>${c}<br><span style="font-weight:400;opacity:.7;font-size:.68rem">${ps[i]||''}</span></th>`).join('')}<th>Total</th></tr>`;
  const rows=com?d.dados:d.dados.filter(r=>r.tipo!=='subtotal');
  document.getElementById('tb').innerHTML=rows.map(r=>{
    const cls=r.tipo==='subtotal'?'sub':r.tipo==='total'?'tot':'';
    const rt=r.votos.reduce((a,b)=>a+(b||0),0);
    const cells=cs.map((c,i)=>{
      const v=r.votos[i];
      const p=rt>0&&v!=null?v/rt:0;
      return`<td><div class="bw"><span class="b" style="width:${Math.round(p*65)}px;background:${CRS[i]}"></span><span>${fmt(v)}</span><span class="pp">${(p*100).toFixed(1)}%</span></div></td>`;
    }).join('');
    const bra=r.estado==='Brasília (DF)'?'brasilia':'';const clsx=cls||bra;
return`<tr class="${clsx}"><td>${r.estado}${r.estado==='Brasília (DF)'?' <span style="font-size:.7rem;color:#b8860b;font-weight:600">(1ª eleição)</span>':''}</td>${cells}<td><b>${fmt(rt)}</b></td></tr>`;
  }).join('');
}

render();
</script>
</body>
